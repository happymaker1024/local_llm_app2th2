{% extends 'base.html' %}  <!-- 부모페이지로 부터 상속을 받는다는 의미 -->
{% block content %}   <!-- override 자식페이지에서 재정의 하는 블럭 -->
<a href="/"><p class="head_img"></p></a>
<h4>나를 성장시키는 메모</h4>
<br>
<form action="/add" method="post">
    <!-- <textarea name="task" rows="5" placeholder="Enter your task" id="task" required></textarea> -->
    <textarea name="task" rows="5" placeholder="Enter your task" id="task"></textarea>
    <button type="submit" id="add_task">
        Add
    </button>
</form>

<br>
<h2>Tasks</h2>
<!-- 벡엔드에서 처리한 동적 데이터 랜더링 -->
<div>
    <!-- <div class="task"> -->
    <div>
      {% if todos == 0 %}
        <!-- todos 레코드가 하나도 없은때 실행 -->
        <br>
        <p> 입력한 TODO 메모가 없습니다. </p>
      {% else %}
      <!-- todos 레코드가 1개 이상일 때 실행 -->
        {% for todo in todos %}
        <div class="task">
            {% if todo.completed %}
                <strike>{{ todo.task }}</strike>
            {% else %}
                {{ todo.task }}
            {% endif %}
            <div class="task-actions">
                <a href="/edit/{{ todo.id }}" class="todo-btn">Edit</a>
                <form action="/delete/{{ todo.id }}" method="post">
                    <button type="submit" class="todo-btn">Delete</button>
                </form>
            </div>
        </div>
        {% endfor %}
      {% endif %}
    </div>
    <!-- </div> -->
</div>
{% endblock content %}
